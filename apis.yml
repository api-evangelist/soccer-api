apis:
- name: Soccer API
  description: >-
    The advertised live football data API — REST plus a WebSocket stream — covering competitions,
    fixtures, live scores, match events, standings, teams, players, line-ups, statistics,
    head-to-head, odds, predictions and historical data. NOT CALLABLE AS OF 2026-08-27, and
    deliberately recorded without a baseURL. The reference at /api-documentation/ states in its own
    words that "the base URL, authentication method, endpoint paths, field names, request quotas,
    WebSocket protocol and response examples on this page are documentation placeholders until the
    final production Soccer API specification is supplied", prints https://api.example.com/v1 as
    the base and wss://stream.example.com/v1/soccer as the stream, and populates every example with
    invented entities ("Example Premier League", match_74021, North City). Neither
    api.soccer-api.com nor stream.soccer-api.com resolves in DNS. No OpenAPI, AsyncAPI, GraphQL
    SDL, Postman collection, apis.json or llms.txt is published, and all seven probed
    /.well-known/* paths return 404. The endpoint paths visible in the documentation were NOT
    modelled into artifacts here, because the vendor states they are unconfirmed — an invented
    contract would be worse than none.
