aid: soccer-api
name: Soccer API
description: >-
  Soccer API (soccer-api.com) is a Spain-contacted vendor marketing live football data — fixtures,
  live scores, match events, standings, teams, players, line-ups, statistics, head-to-head, odds,
  predictions, historical seasons and a real-time WebSocket feed — to developers building sports,
  fantasy, media and betting applications. The site went live in August 2026 and publishes
  documentation, coverage and pricing pages plus a small tutorial blog. Re-probed on 2026-08-27,
  the product is announced but not shipped: every one of those three pages carries the vendor's own
  notice declaring its contents placeholders pending a production specification, the documented
  base URL is the literal example host https://api.example.com/v1, the coverage matrix names no
  real competition, all paid prices read "$XX", and there is no sign-up, console, key issuance or
  machine-readable contract of any kind. Access is requested by WhatsApp or email.
