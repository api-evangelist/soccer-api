  note: >-
    Submitted via apis.io/add on 2026-08-23 and PARKED by the gate at rating 12 rather than
    published. Listed here on the standing rule that a valid company with a real product gets a
    listing and the rating speaks for the rest.
    NO MACHINE-READABLE SURFACE EXISTS, and apis[] is empty rather than modelled. The submitted
    APIs.json at https://soccer-api.com/apis.json returns 404 against a control that also 404s, so
    the 404 is real. So do /llms.txt, /docs, /api and /openapi.json — every one a genuine 404 with
    a ~156KB error page, not a catch-all. The site itself is live and real, with coverage, pricing
    and blog pages and a "Get API Access" sign-up, but nothing a machine can read is published.
    That is what the score will reflect.
