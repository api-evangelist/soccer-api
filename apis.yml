x-provenance:
  added: '2026-08-24'
  method: searched
  source: https://soccer-api.com/
  note: >-
    Submitted via apis.io/add on 2026-08-23 and PARKED by the gate at rating 12 rather than
    published. Listed on the standing rule that a valid company with a real product gets a listing
    and the rating speaks for the rest. Round two (2026-08-27) ran full STEP 0b contract discovery
    against soccer-api.com and found the earlier read too generous: this is not a documented API
    without a contract, it is an unfinished template site for an API that does not yet exist. See
    x-scaffold. The address given on the apis.io submission was soccerapi@outlook.com; the
    maintainer email below is info@soccer-api.com, the address the provider publishes on its own
    site, which is the verifiable one.
x-scaffold:
  detected: '2026-08-27'
  self_confessed: true
  note: >-
    THE PROVIDER'S OWN PAGES DECLARE THEMSELVES PLACEHOLDERS. This is recorded explicitly so no
    later pass mistakes the site's completeness for a shipped product, and so nothing on it is ever
    modelled into an artifact.
  evidence:
  - url: https://soccer-api.com/api-documentation/
    status: 200
    quote: >-
      Implementation notice: The base URL, authentication method, endpoint paths, field names,
      request quotas, WebSocket protocol and response examples on this page are documentation
      placeholders until the final production Soccer API specification is supplied. Replace them
      with confirmed values before publishing.
  - url: https://soccer-api.com/api-pricing/
    status: 200
    quote: >-
      Pricing notice: The prices, request quotas, competition limits, support levels and plan
      inclusions on this page are implementation placeholders until the final commercial packages
      are approved. Replace every placeholder before publishing.
  - url: https://soccer-api.com/api-coverage/
    status: 200
    quote: >-
      Coverage notice: The examples and coverage labels on this page are structural placeholders
      until the final production competition list and endpoint matrix are supplied. Do not publish
      unsupported league counts, season counts or endpoint availability.
  corroborating:
  - The documented base URL is https://api.example.com/v1 and the stream is
    wss://stream.example.com/v1/soccer — both example.com placeholders.
  - Neither api.soccer-api.com nor stream.soccer-api.com resolves in DNS.
  - The coverage matrix rows read "Competition A" through "Competition D" with every cell set to
    "Confirm"; no real league is named anywhere on the site.
  - Starter, Growth and Pro are all priced "$XX / month"; every quota cell reads "Placeholder
    quota" or "Placeholder limit".
  - The rate-limit section instructs the site owner, not the developer - "Do not publish numeric
    limits until they are confirmed."
  - The site's own WordPress metadata at https://soccer-api.com/wp-json/ (HTTP 200) reads
    '"name":"Soccer API","description":"Real-Time Cricket API"' - the build was templated from a
    cricket-data site and the tagline was never changed.
  - Every "Get API Access", "Choose <tier>" and "Contact Sales" control on the site resolves to
    https://wa.me/34675372893 or mailto:info@soccer-api.com. There is no sign-up form, no console,
    no account and no key issuance.
  - The site's own navigation links https://soccer-api.com/soccer-predictions-api/, which returns
    HTTP 404 and is absent from the sitemap.
  - The favicon is wp-content/uploads/2026/08/cropped-ChatGPT-Image-Aug-6-2026-02_59_14-PM.png; the
    sitemap's earliest lastmod is 2026-08-06, making the whole site about three weeks old at the
    time of this probe.
